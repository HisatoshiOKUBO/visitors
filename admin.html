<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>管理者画面｜株式会社サイボクファーム 来場者記録</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gd:#1a3d1f;--gm:#2c6e35;--gl:#4a9954;--gp:#e8f4e9;--gb:#b8d9bb;
  --bg:#f5f0e8;--bgd:#e8e0d0;--td:#1a1a18;--tm:#3d3d36;--tl:#7a7a70;
  --wh:#ffffff;--er:#c0392b;--ep:#fdecea;
  --s1:0 2px 8px rgba(26,61,31,.10);--s2:0 6px 24px rgba(26,61,31,.14);--s3:0 16px 48px rgba(26,61,31,.22);
  --r:10px;--rs:6px;--tr:.22s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--td);min-height:100vh;line-height:1.7}
.site-header{background:#f0f2ef;box-shadow:0 2px 6px rgba(0,0,0,.08);position:sticky;top:0;z-index:100;padding:8px 20px 6px}
.header-row1{display:flex;justify-content:center;align-items:center;margin-bottom:6px}
.header-row1 img{height:26px;width:auto;display:block}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.header-titles{flex:1;min-width:0}
.header-company{font-family:'Noto Serif JP',serif;font-size:clamp(10px,2vw,12px);color:rgba(26,61,31,.6);letter-spacing:.06em}
.header-title{font-family:'Noto Serif JP',serif;font-size:clamp(13px,3vw,17px);font-weight:700;letter-spacing:.05em;color:var(--gd)}
.admin-badge{background:rgba(26,61,31,.1);border:1px solid rgba(26,61,31,.25);border-radius:4px;font-size:11px;padding:2px 7px;vertical-align:middle;margin-left:6px;color:var(--gd)}
.btn-logout{background:rgba(26,61,31,.08);border:1.5px solid rgba(26,61,31,.25);color:var(--gd);font-size:12px;padding:6px 14px;border-radius:var(--rs);cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr);flex-shrink:0}
.btn-logout:hover{background:rgba(26,61,31,.15)}
.main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:65vh}
.login-card{background:var(--wh);border-radius:var(--r);box-shadow:var(--s2);padding:40px 36px;width:100%;max-width:380px;border:1px solid var(--gb)}
.login-icon{font-size:40px;text-align:center;margin-bottom:6px}
.login-title{font-family:'Noto Serif JP',serif;font-size:19px;font-weight:700;color:var(--gd);text-align:center;margin-bottom:22px}
.login-error{background:var(--ep);color:var(--er);border:1.5px solid #f5c6c2;border-radius:var(--rs);padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.login-error.show{display:block}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
label.flabel{font-size:12px;font-weight:500;color:var(--tm);letter-spacing:.04em}
input[type="password"]{width:100%;padding:11px 13px;border:1.5px solid var(--gb);border-radius:var(--rs);background:var(--wh);font-family:'Noto Sans JP',sans-serif;font-size:15px;color:var(--td);transition:var(--tr)}
input[type="password"]:focus{outline:none;border-color:var(--gm);box-shadow:0 0 0 3px rgba(44,110,53,.12)}
.btn-login{width:100%;padding:12px;background:var(--gm);color:var(--wh);border:none;border-radius:var(--rs);font-size:15px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr)}
.btn-login:hover{background:var(--gd)}
.card{background:var(--wh);border-radius:var(--r);box-shadow:var(--s1);padding:26px 26px 22px;margin-bottom:20px;border:1px solid var(--gb)}
.card-title{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:700;color:var(--gd);margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--gp);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;background:var(--gl);border-radius:50%;display:inline-block;flex-shrink:0}
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.filter-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;color:var(--tl)}
.fg input[type="date"]{padding:8px 10px;border:1.5px solid var(--gb);border-radius:var(--rs);font-size:13px;font-family:'Noto Sans JP',sans-serif;background:var(--wh);color:var(--td)}
.btn-filter{padding:9px 16px;border-radius:var(--rs);border:1.5px solid var(--gb);background:var(--wh);color:var(--gm);font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr)}
.btn-filter:hover{background:var(--gp);border-color:var(--gm)}
.export-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-csv{padding:9px 18px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr);display:inline-flex;align-items:center;gap:5px;border:none}
.btn-csv{background:var(--wh);color:#1565C0;border:1.5px solid #90CAF9}
.btn-csv:hover{background:#E3F2FD}
.confirm-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--bgd);align-items:flex-end}
.confirm-bar span{font-size:12px;color:var(--tl);white-space:nowrap;align-self:center}
.confirm-bar .fg{flex:1;min-width:130px}
.confirm-bar input[type="text"],.confirm-bar input[type="date"]{width:100%;padding:7px 10px;border:1.5px solid var(--gb);border-radius:var(--rs);font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--td);background:var(--wh)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
thead tr{background:var(--gd);color:var(--wh)}
th{padding:10px 8px;text-align:center;font-weight:500;font-size:12px;white-space:nowrap;letter-spacing:.03em}
tbody tr{border-bottom:1px solid var(--bgd)}
tbody tr:hover{background:var(--gp)}
td{padding:9px 8px;vertical-align:middle}
td.c{text-align:center}
.ck{color:var(--gm);font-weight:700}
.cn{color:var(--bgd)}
.count-bar{font-size:12px;color:var(--tl);margin-top:8px;text-align:right}
.empty{text-align:center;padding:44px 0;color:var(--tl);font-size:14px}
.empty .ico{font-size:38px;margin-bottom:8px}
.btn-del{background:var(--wh);color:var(--er);border:1.5px solid #f5c6c2;border-radius:var(--rs);font-size:12px;padding:5px 11px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr)}
.btn-del:hover{background:var(--ep)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--wh);border-radius:var(--r);box-shadow:var(--s3);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;animation:popIn .2s ease}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:2px solid var(--gp)}
.modal-title{font-family:'Noto Serif JP',serif;font-size:17px;font-weight:700;color:var(--gd)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--tl);line-height:1;padding:2px 6px}
.modal-close:hover{color:var(--td)}
.modal-body{padding:20px 22px}
.modal-footer{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--gp)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.mg .full{grid-column:1/-1}
.mfg{display:flex;flex-direction:column;gap:4px}
.mfg label{font-size:12px;font-weight:500;color:var(--tm)}
.mfg input[type=text],.mfg input[type=date],.mfg input[type=time],.mfg select,.mfg textarea{width:100%;padding:9px 11px;border:1.5px solid var(--gb);border-radius:var(--rs);font-family:'Noto Sans JP',sans-serif;font-size:14px;color:var(--td);background:var(--wh)}
.mfg input:focus,.mfg select:focus,.mfg textarea:focus{outline:none;border-color:var(--gm);box-shadow:0 0 0 3px rgba(44,110,53,.12)}
.mfg textarea{resize:vertical;min-height:64px}
.mcheck-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:4px}
.mcheck-item{display:flex;align-items:flex-start;gap:10px;padding:8px 12px;background:var(--gp);border-radius:var(--rs);cursor:pointer;user-select:none}
.mcheck-item input{margin-top:3px;width:16px;height:16px;accent-color:var(--gm);flex-shrink:0}
.mcheck-item span{font-size:12px;color:var(--td);line-height:1.5}
.mcheck-num{font-size:11px;font-weight:700;color:var(--gd);background:var(--wh);border-radius:3px;padding:0 4px;margin-right:4px}
.btn-save{padding:11px 28px;background:var(--gm);color:var(--wh);border:none;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr)}
.btn-save:hover{background:var(--gd)}
.btn-cancel{padding:11px 22px;background:var(--wh);color:var(--tm);border:1.5px solid var(--gb);border-radius:var(--rs);font-size:14px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr)}
.btn-cancel:hover{background:var(--gp)}
.btn-add{padding:9px 18px;background:var(--gm);color:var(--wh);border:none;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr);display:inline-flex;align-items:center;gap:5px}
.btn-add:hover{background:var(--gd)}
.btn-edit{background:var(--wh);color:var(--gm);border:1.5px solid var(--gb);border-radius:var(--rs);font-size:12px;padding:4px 10px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:var(--tr);margin-right:4px}
.btn-edit:hover{background:var(--gp);border-color:var(--gm)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:600}
.toast.show{opacity:1}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--gb);border-top-color:var(--gm);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
#view-admin{display:none}
@media(max-width:600px){.mg{grid-template-columns:1fr}.mg .full{grid-column:1}}
</style>
</head>

<script>
// ============================================================
//  ★★★ ここを自分のSupabase情報に書き換えてください ★★★
// ============================================================
const SUPABASE_URL     = 'https://eqpbaffvslpxawltrbpc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxcGJhZmZ2c2xweGF3bHRyYnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NjgyMDgsImV4cCI6MjA5NTU0NDIwOH0.47kauTC5Ybot15RRvsKc0cBZcNWfYEc5rYxUbUBo8_8';
/// 管理者パスワード（admin.phpの ADMIN_PASSWORD と同じ値を設定してください）
const ADMIN_PASSWORD   = 'saibokufarm';
// ============================================================

function sbH() {
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}
async function sbGet(table, params='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: sbH() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method:'POST', headers:sbH(), body:JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(table, filter, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, { method:'PATCH', headers:sbH(), body:JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, filter) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filter}`, { method:'DELETE', headers:{...sbH(),'Prefer':''} });
  if (!r.ok) throw new Error(await r.text());
}

// ===== 認証 =====
let isLoggedIn = false;
let allRecords = [];

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(t) { return t ? String(t).substring(0,5) : ''; }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

document.getElementById('btn-login').addEventListener('click', () => {
  const pw = document.getElementById('pw').value;
  if (pw === ADMIN_PASSWORD) {
    isLoggedIn = true;
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-admin').style.display = 'block';
    document.getElementById('btn-logout').style.display = 'block';
    loadRecords();
  } else {
    document.getElementById('login-error').classList.add('show');
  }
});
document.getElementById('pw').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btn-login').click(); });
document.getElementById('btn-logout').addEventListener('click', () => {
  isLoggedIn = false;
  document.getElementById('view-admin').style.display = 'none';
  document.getElementById('view-login').style.display = 'flex';
  document.getElementById('btn-logout').style.display = 'none';
  document.getElementById('pw').value = '';
});

// ===== 記録読み込み =====
async function loadRecords() {
  const tbody = document.getElementById('rec-tbody');
  tbody.innerHTML = '<tr><td colspan="15"><div class="empty"><div class="spinner"></div> 読み込み中…</div></td></tr>';
  try {
    let params = 'order=visit_date.desc,arrive_time.desc';
    const from = document.getElementById('filter-from').value;
    const to   = document.getElementById('filter-to').value;
    if (from) params += `&visit_date=gte.${from}`;
    if (to)   params += `&visit_date=lte.${to}`;
    allRecords = await sbGet('vis_records', params);
    renderTable(allRecords);
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="15"><div class="empty" style="color:var(--er)">読み込みエラー: ${esc(e.message)}</div></td></tr>`;
  }
}

function renderTable(records) {
  const tbody = document.getElementById('rec-tbody');
  if (!records.length) {
    tbody.innerHTML = '<tr><td colspan="15"><div class="empty"><div class="ico">📋</div>該当する記録がありません</div></td></tr>';
    document.getElementById('count-bar').textContent = '';
    return;
  }
  const CHECK_LABELS = ['車両及び靴の消毒','他施設立入・海外渡航なし','未消毒物品持込なし','海外使用物品持込なし','ダウンタイム2日以上'];
  tbody.innerHTML = records.map(r => {
    const lt = r.leave_time && r.leave_time !== '00:00:00' ? fmtTime(r.leave_time) : '<span style="color:#aaa;font-size:12px">未退場</span>';
    const checks = [1,2,3,4,5].map(i =>
      `<td class="c">${r['check'+i] ? '<span class="ck">✓</span>' : '<span class="cn">—</span>'}</td>`
    ).join('');
    return `<tr>
      <td>${esc(r.visit_date)}</td>
      <td class="c">${fmtTime(r.arrive_time)}</td>
      <td class="c">${lt}</td>
      <td>${esc(r.visitor_name)}</td>
      <td>${esc(r.company_name)}</td>
      <td>${esc(r.tel||'')}</td>
      <td>${esc(r.purpose)}</td>
      <td class="c">${esc(r.travel||'')}</td>
      <td class="c">${esc(r.area||'')}</td>
      ${checks}
      <td style="white-space:nowrap">
        <button class="btn-edit" onclick="openModal(${r.id})">訂正</button>
        <button class="btn-del" onclick="deleteRecord(${r.id})">削除</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('count-bar').textContent = `全 ${records.length} 件`;
}

function clearFilter() {
  document.getElementById('filter-from').value = '';
  document.getElementById('filter-to').value = '';
  loadRecords();
}

// ===== モーダル =====
function openModal(id) {
  const today = new Date().toISOString().slice(0,10);
  const now   = new Date().toTimeString().slice(0,5);
  document.getElementById('m_id').value = id || 0;
  if (id) {
    const r = allRecords.find(x=>x.id===id);
    if (!r) return;
    document.getElementById('modalTitle').textContent = '記録を訂正';
    document.getElementById('m_save').textContent = '更新する';
    document.getElementById('m_vd').value  = r.visit_date  || today;
    document.getElementById('m_at').value  = fmtTime(r.arrive_time);
    const lt = r.leave_time || '';
    document.getElementById('m_lt').value  = (lt && lt!=='00:00:00') ? fmtTime(lt) : '';
    document.getElementById('m_vn').value  = r.visitor_name  || '';
    document.getElementById('m_cn').value  = r.company_name  || '';
    document.getElementById('m_tel').value = r.tel    || '';
    document.getElementById('m_pu').value  = r.purpose || '';
    document.getElementById('m_tr').value  = r.travel  || '';
    document.getElementById('m_ar').value  = r.area    || '';
    for (let i=1;i<=5;i++) document.getElementById('m_c'+i).checked = !!r['check'+i];
  } else {
    document.getElementById('modalTitle').textContent = '記録を追加';
    document.getElementById('m_save').textContent = '追加する';
    ['m_vd','m_at','m_lt','m_vn','m_cn','m_tel','m_pu','m_tr','m_ar'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('m_vd').value = today;
    document.getElementById('m_at').value = now;
    for (let i=1;i<=5;i++) document.getElementById('m_c'+i).checked = false;
  }
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// ===== 保存 =====
async function saveRecord() {
  const id = parseInt(document.getElementById('m_id').value) || 0;
  const body = {
    visit_date:   document.getElementById('m_vd').value,
    arrive_time:  document.getElementById('m_at').value + ':00',
    leave_time:   document.getElementById('m_lt').value ? document.getElementById('m_lt').value + ':00' : null,
    visitor_name: document.getElementById('m_vn').value.trim(),
    company_name: document.getElementById('m_cn').value.trim(),
    tel:          document.getElementById('m_tel').value.trim(),
    purpose:      document.getElementById('m_pu').value.trim(),
    travel:       document.getElementById('m_tr').value.trim(),
    area:         document.getElementById('m_ar').value.trim(),
    check1:       document.getElementById('m_c1').checked,
    check2:       document.getElementById('m_c2').checked,
    check3:       document.getElementById('m_c3').checked,
    check4:       document.getElementById('m_c4').checked,
    check5:       document.getElementById('m_c5').checked,
  };
  if (!body.visit_date || !body.arrive_time || !body.visitor_name || !body.company_name || !body.purpose) {
    toast('必須項目を入力してください'); return;
  }
  try {
    if (id) {
      await sbPatch('vis_records', `id=eq.${id}`, body);
      toast('更新しました ✓');
    } else {
      await sbPost('vis_records', body);
      toast('追加しました ✓');
    }
    closeModal();
    await loadRecords();
  } catch(e) { toast('保存エラー: ' + e.message); }
}

// ===== 削除 =====
async function deleteRecord(id) {
  if (!confirm('この記録を削除しますか？')) return;
  try {
    await sbDelete('vis_records', `id=eq.${id}`);
    toast('削除しました');
    await loadRecords();
  } catch(e) { toast('削除エラー: ' + e.message); }
}

// ===== CSV出力 =====
function exportCSV() {
  const from = document.getElementById('filter-from').value;
  const to   = document.getElementById('filter-to').value;
  let rows = allRecords;
  if (from) rows = rows.filter(r => r.visit_date >= from);
  if (to)   rows = rows.filter(r => r.visit_date <= to);
  const cDate = document.getElementById('exp-cd').value;
  const cBy   = document.getElementById('exp-cb').value;
  const BOM = '\uFEFF';
  const header = ['日付','来場時間','退場時間','氏名','会社・団体名','連絡先','用件','過去状況','区域立入','チェック1','チェック2','チェック3','チェック4','チェック5'];
  const lines = [header.join(',')];
  rows.forEach(r => {
    const lt = r.leave_time && r.leave_time !== '00:00:00' ? fmtTime(r.leave_time) : '';
    const row = [
      r.visit_date, fmtTime(r.arrive_time), lt,
      r.visitor_name, r.company_name, r.tel||'', r.purpose,
      r.travel||'', r.area||'',
      r.check1?'✓':'', r.check2?'✓':'', r.check3?'✓':'', r.check4?'✓':'', r.check5?'✓':'',
    ].map(v => { const s=String(v||''); return (s.includes(',')||s.includes('"'))?`"${s.replace(/"/g,'""')}"`:s; });
    lines.push(row.join(','));
  });
  if (cDate || cBy) { lines.push(''); lines.push(`"確認日","${cDate}","確認者","${cBy}"`); }
  const blob = new Blob([BOM + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `来場者記録_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ===== PDF出力 =====
function exportPDF() {

  const to   = document.getElementById('filter-to').value;
  let rows = allRecords;
  if (from) rows = rows.filter(r => r.visit_date >= from);

  const CHECK_LABELS = [
    '車両及び靴の消毒はしましたか？',
    '当日、他の畜産関連施設への立ち入り、または、過去1週間以内の海外渡航履歴はありませんか？',
    '他の畜産関連施設で使用した未消毒の衣服や物品を持ち込んでいませんか？',

    return `<tr><td>${r.visit_date}</td><td class="c">${fmtTime(r.arrive_time)}</td>${lt}<td>${r.visitor_name}</td><td>${r.company_name}</td><td>${r.tel||''}</td><td>${r.purpose}</td><td class="c">${r.travel||''}</td><td class="c">${r.area||''}</td>${checks}</tr>`;

  const checkHtml = CHECK_LABELS.map((l,i)=>`<p style="margin:2px 0;font-size:8pt"><strong>項目${i+1}：</strong>${l}</p>`).join('');
  const confirmHtml = (cDate||cBy) ? `<div style="margin-top:16px;font-size:9pt;display:flex;gap:40px"><span>確認日：<span style="border-bottom:1px solid #333;display:inline-block;min-width:120px;padding:0 4px">${cDate}</span></span><span>確認者：<span style="border-bottom:1px solid #333;display:inline-block;min-width:120px;padding:0 4px">${cBy}</span></span></div>` : '';
  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>来場者記録</title>
<style>@page{size:A4 landscape;margin:12mm}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"MS Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-size:9pt;padding:8px}h1{text-align:center;font-size:13pt;margin-bottom:8px}table{width:100%;border-collapse:collapse;margin-bottom:12px}th,td{border:1px solid #333;padding:3px 5px;vertical-align:middle}th{background:#e8e8e8;font-size:8pt;text-align:center}td.c{text-align:center}.btn-bar{margin-bottom:12px;display:flex;gap:8px}.btn-print{padding:8px 24px;background:#2c5f2e;color:#fff;border:none;border-radius:4px;font-size:13px;cursor:pointer}@media print{.btn-bar{display:none}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
</head><body>
<div class="btn-bar"><button class="btn-print" onclick="window.print()">🖨️ PDFとして保存 / 印刷</button><button class="btn-print" style="background:#555" onclick="window.close()">✕ 閉じる</button></div>
<h1>【 株式会社　サイボクファーム　来場者記録 】</h1>
<table><thead><tr><th>日付</th><th>来場</th><th>退場</th><th>氏名</th><th>会社・団体名</th><th>連絡先</th><th>用件</th><th>過去状況</th><th>区域立入</th><th>項1</th><th>項2</th><th>項3</th><th>項4</th><th>項5</th></tr></thead><tbody>${trRows}</tbody></table>
<div><strong>チェック項目</strong>${checkHtml}</div>
${confirmHtml}
</body></html>`;
  const w = window.open('', '_blank');
  if (w) { w.document.write(html); w.document.close(); setTimeout(()=>w.print(), 400); }
}
</script>
